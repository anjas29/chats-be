name: CI

on:
    pull_request:
    push:
        branches: [main]

jobs:
    tests:
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_DATABASE: chats_test
                    MYSQL_USER: chats
                    MYSQL_PASSWORD: secret
                    MYSQL_ROOT_PASSWORD: secret
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h localhost -psecret"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=20

        env:
            DB_CONNECTION: mysql
            DB_HOST: 127.0.0.1
            DB_PORT: 3306
            DB_DATABASE: chats_test
            DB_USERNAME: chats
            DB_PASSWORD: secret

        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.5"
                  extensions: intl, gd, exif, pcntl, pdo_mysql, redis
                  coverage: none

            - name: Install dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Prepare environment
              run: |
                  cp .env.example .env
                  php artisan key:generate

            - name: Code style
              run: vendor/bin/pint --test

            - name: Tests
              run: php artisan test
